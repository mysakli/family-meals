services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-meals}
      POSTGRES_USER: ${DB_USER:-meals}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - meals_pgdata:/var/lib/postgresql/data
    # Only reachable from other Compose services, not the public internet
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-meals} -d ${DB_NAME:-meals}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://${DB_USER:-meals}:${DB_PASSWORD}@db:5432/${DB_NAME:-meals}
      DB_HOST: db
      DB_PORT: "5432"
    depends_on:
      db:
        condition: service_healthy
    # Localhost only — Tailscale Serve (or SSH tunnel) reaches the app
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      # Persist uploaded media if USE_S3=False
      - meals_media:/app/media

volumes:
  meals_pgdata:
  meals_media:
